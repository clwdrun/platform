[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
# intra-workspace. Carries a version as well as a path so `cargo deny`'s
# wildcard check stays meaningful; CLAUDE.md blesses the path dep itself.
shared = { version = "0.1.0", path = "crates/shared" }
builder = { version = "0.1.0", path = "crates/builder" }

# shared
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
thiserror = "2.0.20"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
tonic = { version = "0.14.6", features = ["tls"] }
prost = { version = "0.14.4", features = ["prost-derive"] }
async-compression = { version = "0.4.43", features = ["tokio"] }
tokio-stream = "0.1.19"

# control-plane
axum = "0.8.9"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "migrate",
] }
# `timeout` and `catch-panic` are load-bearing for the error envelope: a
# handler that hangs or panics must still produce one rather than dropping the
# connection. `set-header` echoes the request id back.
tower-http = { version = "0.7.0", features = [
  "trace",
  "cors",
  "timeout",
  "catch-panic",
  "set-header",
] }
tower = "0.5"
# The OpenAPI document (#3) is built with utoipa's builders from the route
# table, not from `#[utoipa::path]` annotations — an annotation would be a
# second description of a route. `uuid` and `chrono` give the id and timestamp
# fields their formats.
utoipa = { version = "5.5.0", features = ["uuid", "chrono"] }
apalis = "0.7.4"
# Identifiers are UUIDv7, minted by the application — see migrations/.
uuid = { version = "1.26.0", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
async-nats = { version = "0.50.0", features = ["tokio"] }
# gateway. `boringssl` is REQUIRED for TLS: pingora's default feature set is
# empty, so `TlsSettings`, `TlsAccept` and `ext::ssl_use_certificate` do not
# exist without a backend feature — the bare crate compiles the TLS module out.
# BoringSSL over rustls per the #5 decision (rustls is experimental in pingora
# and the per-org SNI callback is the wrong place to be its first user); it
# needs the C toolchain #42 added to the Dockerfile.
pingora = { version = "0.8.1", features = ["boringssl"] }
instant-acme = { version = "0.8.5", default-features = true, features = [
  "rcgen",
  # ARI renewal (#5 Phase 4): `time` gates `Account::renewal_info`;
  # `x509-parser` gates `CertificateIdentifier: TryFrom<&CertificateDer>` (the
  # ARI cert id, and what `NewOrder::replaces` needs for rate-limit exemption).
  "time",
  "x509-parser",
] }
moka = { version = "0.12", features = ["future"] }
tower-cookies = "0.11.0"
# The gateway's HTTP client: the internal route-lookup call now, and the ACME
# client's transport in #3. No TLS feature — the control-plane lookup is a
# cluster-internal call; `rustls-tls` goes on when it first crosses a TLS
# boundary. `json` pulls in serde_json for `.json()`.
# 0.13 to match the version opendal and opentelemetry-http already pull in —
# pinning 0.12 would add a second copy to the graph.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  # `.query()` for the Cloudflare list-records call's query string.
  "query",
  # The Cloudflare API is HTTPS. rustls (not native-tls) to avoid an OpenSSL
  # system dependency; the `rustls` feature bundles the aws-lc-rs provider, the
  # same one `acme::install_crypto_provider` installs, so there is no second
  # provider. `webpki-roots` bundles the CA roots (no system trust-store dep).
  "rustls",
] }
# Authoritative-nameserver DNS queries for the ACME DNS-01 propagation check: a
# recursive resolver's view lags, and validating before the authoritative NS
# serves the record burns a failed-validation attempt.
hickory-resolver = "0.26"
# ARI renewal (#5 Phase 4): x509-parser reads the issued cert's notAfter/notBefore
# for the fallback renewal schedule; `time` handles the OffsetDateTime the ARI
# window is expressed in. Versions match what instant-acme pulls, so no duplicate.
x509-parser = "0.18"
time = "0.3"
# `http` types for the pingora `ServeHttp` response; `async-trait` for its trait.
# Both are already in the graph transitively, so they add no crates.
http = "1"
# Per-token rate limiting in the control plane (#4). `dashmap` is the keyed
# store; `jitter` and `quanta` are left off because nothing here wants either
# and they are crates for nothing.
governor = { version = "0.10.4", default-features = false, features = [
  "std",
  "dashmap",
] }
# Token hashing and generation (#4). Both versions are the ones sqlx and
# opentelemetry already resolve, so they add no crates to the graph.
sha2 = "0.10.9"
getrandom = "0.3.4"

# identity — share grants modeled as Cedar entities from day one.
# default-features off: their defaults bundle reqwest with its own TLS, pulling
# native-tls + an OpenSSL build into a rustls-only workspace. The flow's HTTP
# runs through the platform's own reqwest 0.13 via an executor closure, so only
# the (non-feature-gated) JWT crypto is needed. This restores deny.toml's ban on
# native-tls/openssl-sys. #9 owns this; see the note in deny.toml.
openidconnect = { version = "4.0.1", default-features = false }
oauth2 = { version = "5.0.0", default-features = false }
# jsonwebtoken 10+ ships no crypto unless exactly one backend feature is on;
# with neither, every sign/verify panics at runtime (not at compile time).
# aws_lc_rs: already in the tree via rustls, so no new crypto stack.
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
cedar-policy = "4"

# builder
opendal = { version = "0.58.2", features = ["services-memory", "services-fs"] }
zstd = "0.13"
mimalloc = "0.1.52"
dashmap = "6.2.1"
parking_lot = "0.12.1"

# app-data — libsql or redb per app, plus a secret broker
libsql = "0.9.30"
redb = "4.2.0"
age = "0.12.1"
object_store = "0.14.1"

# The public repo, via a tag-pinned git dependency — never a path dependency.
# `just seam` enforces the tag; deny.toml's [sources] enforces the origin.
#
# clwd-bundle only. clwd-sdk is the guest SDK app code links against: no_std,
# wit-bindgen, built for wasm32-wasip2. It compiles on a host target, but
# nothing here calls it, and adding it drags wit-parser/wit-component in as
# build dependencies for zero call sites. It goes in when a crate needs it.
#
# `version` IS load-bearing, and not for the reason it looks like. The tempting
# argument for dropping it — a tag is immutable, so nothing can drift beneath
# the pin, so why state a version twice? — is true and beside the point. The
# key exists for deny.toml's `wildcards = "deny"`: a git dependency with no
# version reads as `*`, so removing it fails the gate with
#
#     error[wildcard]: found 2 wildcard dependencies for crate 'shared'
#
# This has now been rediscovered the hard way once. Do not drop it again.
#
# Keep the value equal to the version the tag's crates actually declare. It is
# a constraint checked against the fetched manifest, not a selector, so a wrong
# value is a hard resolution failure rather than a silent fallback:
#
#     error: failed to select a version for the requirement `clwd-bundle = "^0.1.0"`
#     candidate versions found which didn't match: 0.0.1
#
# That is what `0.1.0` did here, and it stayed hidden only because Cargo.lock
# still pinned the tag's previous commit. When bumping the tag, run
# `cargo update -p clwd-bundle` so any mismatch surfaces now, not in CI.
clwd-bundle = { version = "0.0.1", git = "https://github.com/clwdrun/clwd", tag = "v0.0.1" }
