[package]
name = "control-plane"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "control_plane"
path = "src/lib.rs"

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dev-dependencies]
# The mock OIDC issuer the sign-in route tests run against: it signs real ID
# tokens with a throwaway RSA key generated at runtime (no key material in the
# repo), and checks the client's Basic auth and PKCE as Google does. All four
# are already in the tree via identity and openidconnect.
openidconnect = { workspace = true }
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# Only to build a body with no known length, for the chunked-upload test.
futures = { workspace = true }
# An in-memory artifact store for the router tests, which store nothing.
opendal = { workspace = true }
clwd-bundle = { workspace = true }
bytes = { workspace = true }
# Captures every log line the token tests produce, so the leak test can grep
# them rather than trusting that nothing was logged.
tracing-subscriber = { workspace = true }
# Validates the committed OpenAPI document, and every example in it, against
# the vendored OpenAPI 3.1 JSON Schema. No HTTP or file resolution: every schema
# it needs is in the repository, so the check is offline and deterministic.
jsonschema = { version = "0.56.0", default-features = false }
# A mock HTTP server for the Cloudflare provider test: exercises request
# construction and error mapping without hitting live Cloudflare.
wiremock = "0.6"

[dependencies]
axum = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
utoipa = { workspace = true }
apalis = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
shared = { workspace = true }
# ACME certificate issuance (#5). The `rcgen` feature makes `Order::finalize()`
# generate the keypair and CSR and return the key PEM — so the control plane
# needs no separate TLS/crypto stack (boring lives in the gateway, via pingora,
# and issuance does not run there). ARI's types are base API, but the two
# methods renewal uses are feature-gated in the workspace pin:
# `Account::renewal_info` needs `time`, `CertificateIdentifier` needs
# `x509-parser` — both enabled there, so both are available here.
instant-acme = { workspace = true, features = ["rcgen"] }
# Only to install the process-level CryptoProvider instant-acme's rustls needs.
# When both `aws-lc-rs` and `ring` end up linked (feature unification across the
# workspace pulls both), rustls 0.23 refuses to auto-select one and panics at
# runtime — so the provider must be chosen explicitly. aws-lc-rs matches
# instant-acme's default. See `acme::install_crypto_provider`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# The Cloudflare DnsProvider: reqwest for the API, hickory-resolver for the
# authoritative-NS propagation check.
reqwest = { workspace = true }
hickory-resolver = { workspace = true }
# ARI renewal: parse the issued cert's validity, handle the ARI window's OffsetDateTime.
x509-parser = { workspace = true }
time = { workspace = true }
# CertificateDer, to build the ARI CertificateIdentifier from the issued cert.
rustls-pki-types = "1"
# Load-bearing, unlike the last time control-plane depended on this. The
# publish route calls `validate` and `ArtifactStore::put`; #45 took the
# dependency only to read one constant, which pulled 39 crates in for a
# `usize` and was reverted in #47. The constant still comes from `shared`.
builder = { workspace = true }
# API tokens (#4): the digest, the secret's randomness, per-token limits.
sha2 = { workspace = true }
getrandom = { workspace = true }
governor = { workspace = true }
# OIDC sign-in (#9): the flow cookie carrying state/nonce/PKCE-verifier between
# the redirect and the callback is signed as an HS256 JWT. jsonwebtoken is
# already in the tree (identity depends on it); reusing it means tamper and
# expiry come for free and are unit-testable with no HTTP.
jsonwebtoken = { workspace = true }
# The OIDC flow and ID-token verification; the router, cookies and sessions
# live here. Only `&str`s and `VerifiedIdentity` cross the boundary.
identity = { workspace = true }
# Parsing the callback's query by hand, so a malformed one is an envelope
# rather than an extractor's plain-text rejection. Already in the tree via url.
form_urlencoded = "1"
