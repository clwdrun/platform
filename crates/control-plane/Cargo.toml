[package]
name = "control-plane"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "control_plane"
path = "src/lib.rs"

[[bin]]
name = "control-plane"
path = "src/main.rs"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# Only to build a body with no known length, for the chunked-upload test.
futures = { workspace = true }
# An in-memory artifact store for the router tests, which store nothing.
opendal = { workspace = true }
clwd-bundle = { workspace = true }
bytes = { workspace = true }

[dependencies]
axum = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
utoipa = { workspace = true }
apalis = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
shared = { workspace = true }
# Load-bearing, unlike the last time control-plane depended on this. The
# publish route calls `validate` and `ArtifactStore::put`; #45 took the
# dependency only to read one constant, which pulled 39 crates in for a
# `usize` and was reverted in #47. The constant still comes from `shared`.
builder = { workspace = true }
