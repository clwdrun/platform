# Platform is server-side only. clwd's deny.toml also graphs wasm32-wasip2 and
# musl because it ships a guest SDK and a musl agent; nothing here targets
# either, and a target we do not build is a dependency tree we would audit for
# no reason.
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
# Explicit, not defaulted: the meaning of this key changed across cargo-deny
# releases, and a control plane should not have its advisory scope quietly
# widen or narrow on a tool upgrade.
unmaintained = "all"

# Every entry below is third-party debt reached through one dependency this
# workspace cannot currently drop, attributed to the crate that pulls it and
# the issue that will resolve it. None is reachable from `control-plane` or
# `shared`. An entry here is not a silenced failure — it is a recorded
# acceptance, and it must name an owner or it does not belong.
ignore = [
  # pingora 0.8.1 brings all three. Resolved by #5 pinning a newer pingora or
  # choosing a different edge.
  { id = "RUSTSEC-2024-0437", reason = "protobuf 2.28.0 via pingora -> gateway; owned by #5" },
  { id = "RUSTSEC-2024-0388", reason = "derivative 2.2.0 via pingora -> gateway; owned by #5" },
  { id = "RUSTSEC-2025-0069", reason = "daemonize 0.5.0 via pingora -> gateway; owned by #5" },

  # unsafe-libyaml: unmaintained (informational), not a vulnerability.
  # pingora-core parses YAML through serde_yaml only for its server
  # configuration. The gateway calls `Server::new(None)`, which parses
  # pingora's built-in "---\nversion: 1" and never a file, argument or anything
  # else from outside the platform. No fix today: pingora 0.9.0 still depends on
  # serde_yaml ^0.9, and making it optional is upstream cloudflare/pingora#779.
  # Review by 2027-01-12, or sooner if #5 changes the pingora version.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 via serde_yaml -> pingora -> gateway; YAML never from outside; owned by #5; review by 2027-01-12" },

  # openidconnect 4.0.1 -> rsa 0.9.10. Marvin is a timing sidechannel in RSA
  # decryption; the OIDC paths here verify signatures rather than decrypt, but
  # that is a reason to track it, not to call it inapplicable. Owned by #9.
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 via openidconnect -> identity; owned by #9" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # webpki-roots / webpki-root-certs: the Mozilla CA store, shipped as data
  # rather than code. CDLA-Permissive-2.0 governs the certificate set and
  # imposes no obligation on what we redistribute around it.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

# Every crate in this workspace is LicenseRef-Proprietary and publish = false.
# There is no license to check on code we are not distributing.
private = { ignore = true }

# ring and aws-lc-sys carry hand-rolled multi-license text that no SPDX
# expression matches cleanly. Both are fine to distribute; they just need
# naming explicitly.
[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["OpenSSL", "ISC", "Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# clwd denies openssl-sys and native-tls outright, having committed to rustls.
# Platform now matches: #9 turned openidconnect's and oauth2's default features
# off (they otherwise reach reqwest with its default TLS, pulling native-tls and
# an OpenSSL build into a workspace whose selling point is auditability). With
# that path gone the ban is restored here, so a future dependency that reaches
# for either fails the build rather than slipping in silently.
deny = [
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
# The public/private seam, mechanically. A git dependency from anywhere other
# than the one origin below fails the build — verified by removing the
# `allow-git` line and watching this exit 8, not by assuming it.
#
# This allows the ORIGIN, not the pin: cargo-deny does not care whether the
# dependency is on a tag, a branch, or a bare default ref. `just seam` is the
# half that checks the pin, by reading the resolved source out of Cargo.lock.
# Neither is complete without the other, and #8 owns wiring both into CI as
# the seam's mechanical enforcement.
unknown-git = "deny"
allow-git = ["https://github.com/clwdrun/clwd"]
