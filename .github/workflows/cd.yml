# Build the deployable artifacts and publish them.
#
# This is the half of delivery that exists today: an immutable, addressable
# container image per service, built from a commit that passed the gate. It
# stops there deliberately. There is nothing to deploy to yet — infra/ is
# empty, no cluster or host is described anywhere in this repository, and the
# control plane has no routes until #2. Wiring a deploy step to a target that
# does not exist would be a pipeline that cannot be tested, and #31 owns
# describing the target first.
#
# Images are tagged by commit SHA as well as by branch. The SHA tag is the one
# a deployment should reference: `main` moves, and a rollback needs a name that
# does not.
#
# Third-party actions are pinned to a commit SHA, not a tag, for the reason
# given in ci.yml: a tag is mutable and this workflow can write packages.
#
# There is no GitHub build-provenance attestation step. One was written, and it
# failed on every run:
#
#     Failed to persist attestation: Feature not available for the clwdrun
#     organization. To enable this feature, please upgrade the billing plan,
#     or make this repository public.
#
# The attestation API is an Advanced Security feature, unavailable on a private
# repository on the current plan — the same constraint that put gitleaks in this
# repository instead of GitHub secret scanning. It is removed rather than left
# failing: a permanently red job trains people to ignore red, which costs more
# than the attestation was worth.
#
# Deliberate omission, not an oversight. To enable it: GitHub Advanced Security
# on the clwdrun organization, or make this repository public (which is not
# happening). Restoring it is then `actions/attest-build-provenance` plus
# `attestations: write` and `id-token: write`.
#
# Images are NOT unprovenanced in the meantime. `provenance: mode=max` on the
# build step attaches SLSA provenance to the image manifest itself, which is
# buildx's own mechanism and needs nothing from GitHub. What is lost is the
# entry in GitHub's attestation store and `gh attestation verify`, not the
# record of how the image was built.

name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.bin }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # The two binaries in the workspace. They differ only in which one the
        # Dockerfile builds, which is why there is one Dockerfile.
        bin: [control-plane, gateway]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The built-in token, scoped to this repository's packages. No registry
      # credential is stored anywhere, which is one fewer secret to rotate.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.bin }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ matrix.bin }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: BIN=${{ matrix.bin }}
          # The seam dependency is private. A secret, not a build argument:
          # build arguments are readable in image history.
          secrets: |
            clwd_token=${{ secrets.CLWD_READ_TOKEN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache scoped per binary: the two images share a dependency
          # tree but not a final layer, and one scope would thrash.
          cache-from: type=gha,scope=${{ matrix.bin }}
          cache-to: type=gha,scope=${{ matrix.bin }},mode=max
          # SLSA provenance built by buildx and attached to the image manifest.
          # This is not the same thing as a GitHub attestation and needs no API
          # of theirs — see the note above `permissions`.
          provenance: mode=max
