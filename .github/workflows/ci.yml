# The gate, in CI.
#
# This runs `just check` and nothing else. The gate is defined in the justfile
# so that what CI enforces and what a developer can run before pushing are the
# same list — a CI-only check is one nobody can reproduce, and a local-only
# check is one nobody runs.
#
# Third-party actions are pinned to a commit SHA rather than a tag. A tag is
# mutable: whoever controls the action repository can move it, and a workflow
# with write access to this repository is not a place to accept that. The
# comment after each SHA records which release it was, because a bare SHA tells
# a reader nothing about whether it is current.
#
# The seam is enforced in three places, and they check different things:
#
#   deny.toml [sources]  WHERE a git dependency comes from. Does not care how
#                        it is pinned.
#   just seam            HOW it is pinned, read from Cargo.lock so a transitive
#                        git dependency another crate introduces is caught too,
#                        and so a dependency spelled across several lines
#                        cannot slip past. Also rejects a path dependency that
#                        reaches out of this workspace.
#   the standalone job   That the public repository still builds WITHOUT this
#                        one — the leak the two-repo split exists to prevent.
#
# The first two run inside `just check`. The third cannot: it needs a clean
# machine with no platform checkout on it, which is a CI shape rather than a
# recipe a developer runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here comments, pushes, or publishes; a token that cannot
# write is a token that cannot be turned against the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail rather than hang when crates.io is unreachable.
  CARGO_NET_RETRY: 3
  # The seam dependency lives in a private repository, so cargo must fetch it
  # over a transport that can carry credentials. The built-in git library cannot;
  # the git CLI can, and the step below configures it.
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SQLX_CLI_VERSION: 0.9.0

jobs:
  gate:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/clwd_platform
      # The ACME issuance test (crates/control-plane/tests/acme_issue.rs) drives
      # real DNS-01 against Pebble + challtestsrv, started by the step below. The
      # test reads these and fails RED if the servers are unreachable — it never
      # skips, so it cannot be green in the one environment where issuance is
      # untested. Pebble cannot be a `services:` container: those cannot override
      # the command, and Pebble needs `-dnsserver <challtestsrv>` args — so it is
      # started with `just pebble-up` (the same recipe developers run) instead.
      PEBBLE_DIR: https://localhost:14000/dir
      CHALLTESTSRV: http://localhost:8055
      PEBBLE_CA: ${{ github.workspace }}/.pebble/pebble.minica.pem

    steps:
      # Full history: `just secrets` runs `gitleaks detect`, which walks every
      # commit rather than the working tree. A shallow clone would let it pass
      # while a credential sits three commits back.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Free runner disk, in the background. ubuntu-latest has ~10 GB free
      # before this; the gate's target/ is ~6 GB beside the restored cache and
      # registry, which left 1.5 GB in a measured run — too thin, since a full
      # disk shows up as rust-lld SIGBUS linking a test binary. Deleting these
      # preinstalled toolchains frees ~25 GB but took 3.5 minutes in the
      # foreground; run alongside cache restore, tool installs and the build, it
      # costs nothing, and the step before `just check` waits only for room.
      # Docker images are not pruned here: Pebble's are pulled concurrently.
      - name: Free runner disk space (background)
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" \
            > /tmp/free-disk.log 2>&1 &
          echo $! > /tmp/free-disk.pid

      # rust-toolchain.toml pins the version and components. Installing via
      # rustup rather than an action keeps one source of truth for which
      # compiler this workspace builds with.
      - name: Install Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # `clwd` is private, so the default GITHUB_TOKEN — scoped to this
      # repository — cannot read it. CLWD_READ_TOKEN is a fine-grained PAT with
      # `Contents: read` on clwdrun/clwd and nothing else.
      #
      # A PAT is a person-scoped stopgap: it carries someone's identity and it
      # expires. A GitHub App installation token is the durable answer, and is
      # filed separately rather than solved here.
      - name: Authenticate for the clwd seam dependency
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.CLWD_READ_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      # `key` is a cache generation, bumped when something that changes every
      # artifact changes but is not in the default key — the build profile is
      # not. Without the bump, the old full-debuginfo cache kept restoring as a
      # "full match", every run rebuilt cold, and no new cache was ever saved.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lean-debuginfo

      # Isolated, and early. Every later step depends on this having worked, and
      # a credential problem that first surfaces inside a compile reads as a
      # build error three jobs deep rather than as the token problem it is.
      - name: Fetch the seam dependency
        run: |
          if ! cargo fetch --locked; then
            echo "::error::could not fetch dependencies. If clwd-bundle is the one that failed, CLWD_READ_TOKEN is missing, expired, or not scoped to clwdrun/clwd."
            exit 1
          fi
          echo "ok: every dependency fetched, including the private seam"

      - name: Install just and cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: just,cargo-deny

      # sqlx-cli has no prebuilt release, so it is built once and cached on its
      # version. `--locked` so a transitive bump cannot change what the gate
      # runs without a visible cache miss.
      #
      # Both binaries, not just `sqlx`. `cargo install sqlx-cli` produces two:
      # `sqlx`, which `just migrate` uses, and `cargo-sqlx`, which backs
      # `cargo sqlx prepare` in `just sqlx-prepared`. Caching only the first
      # meant a cache hit skipped the install and left the second absent — so
      # `migrate` passed with the cached binary and the gate then failed four
      # minutes later on `error: no such command: sqlx`.
      - name: Cache sqlx-cli
        id: sqlx-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          # The `-2` is a cache generation, and it has to be bumped whenever the
          # set of cached paths changes. Restore is keyed on this string alone,
          # so widening `path` does not invalidate an archive saved under the
          # old key — without the bump, the entry holding only `sqlx` would keep
          # restoring and keep skipping the install.
          key: sqlx-cli-${{ env.SQLX_CLI_VERSION }}-${{ runner.os }}-2

      - name: Install sqlx-cli
        if: steps.sqlx-cache.outputs.cache-hit != 'true'
        run: |
          cargo install sqlx-cli \
            --version "${SQLX_CLI_VERSION}" \
            --no-default-features --features rustls,postgres \
            --locked

      # Cheap, and it fails where the cause is legible. A missing binary is
      # otherwise discovered by whichever recipe happens to need it, minutes
      # into the gate and looking like a problem with that recipe.
      - name: Verify both sqlx binaries are present
        run: |
          for bin in sqlx cargo-sqlx; do
            command -v "$bin" >/dev/null \
              || { echo "::error::$bin is missing. If the cache was restored, its key needs bumping."; exit 1; }
          done
          echo "ok: sqlx and cargo-sqlx both present"

      # Downloaded from the pinned release and checksum-verified before it is
      # unpacked. A secret scanner installed over an unverified pipe is a
      # supply-chain hole in the tool whose whole job is to close one.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks
          gitleaks version

      # Start the test ACME CA (Pebble) + mock DNS (challtestsrv) before the
      # gate, so the issuance test in `just check`'s `test` step runs against
      # them. `just pebble-up` fails loud (bounded readiness wait) if a container
      # does not start, rather than letting the test hang to the job timeout.
      - name: Start Pebble + challtestsrv
        run: just pebble-up

      # One command, the same one a developer runs. Its steps are:
      # secrets, fmt-check, seam, rollback-plans, migrate, clippy,
      # sqlx-prepared, offline-build, migrate-roundtrip, test, deny.
      # Waits only for enough room, not for the deletion to finish: the gate
      # peaks at ~10 GB (target/, registry, cache archive), so 20 GB free is
      # margin, and the rest of the deletion carries on during the build.
      # Waiting for completion instead cost two minutes on a measured run.
      - name: Wait for 20 GB of free disk
        run: |
          pid=$(cat /tmp/free-disk.pid)
          for _ in $(seq 1 240); do
            free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
            [ "$free_gb" -ge 20 ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          df -h /

      - name: just check
        run: just check

      # The headroom, printed, so a build creeping toward the disk limit is
      # visible before it becomes a SIGBUS. A full gate leaves ~6 GB in target/
      # with dependency debuginfo off (Cargo.toml [profile.dev]).
      - name: Disk headroom after the gate
        if: always()
        run: df -h / && du -sh target

  # Build the public repository on its own, with no platform checkout on the
  # machine. `just seam` proves nothing private is REFERENCED from here; this
  # proves nothing private is DEPENDED ON over there. A private type that
  # reached a public crate compiles fine in a tree that contains both and fails
  # the moment the public half is built alone — which is the failure this job
  # exists to produce, and the whole reason the repositories are split.
  standalone:
    name: clwd builds standalone
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: platform

      # The tag comes from the manifest, never from a literal in this file. A
      # hardcoded tag here keeps passing after someone bumps the pin, testing a
      # version nothing uses and reporting green about it.
      #
      # Cargo.lock is asserted to agree, because the manifest states intent and
      # the lock states what cargo actually fetches. A stale lock would
      # otherwise have this job build one tag while the gate built another, and
      # both would look fine.
      - name: Read the pinned tag from the manifest
        id: pin
        working-directory: platform
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^clwd-bundle = .*tag = "\([^"]*\)".*/\1/p' Cargo.toml)
          if [ -z "$tag" ]; then
            echo "::error::no tag found on the clwd-bundle pin in Cargo.toml. If the dependency was renamed or respelled, this parser needs updating — it is what keeps the standalone build following the real pin."
            exit 1
          fi
          locked=$(sed -n 's|^source = "git+https://github.com/clwdrun/clwd?tag=\([^#]*\)#.*|\1|p' Cargo.lock)
          if [ "$tag" != "$locked" ]; then
            echo "::error::Cargo.toml pins $tag but Cargo.lock resolved $locked. Run \`cargo update -p clwd-bundle\` and commit the lock; until then the gate and this job build different versions of the seam."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ok: manifest and lock agree on $tag"

      - name: Checkout clwd at the pinned tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: clwdrun/clwd
          ref: ${{ steps.pin.outputs.tag }}
          token: ${{ secrets.CLWD_READ_TOKEN }}
          path: clwd

      # The isolation this job is named for. Reading the tag needed the
      # manifest; building must not see it. Removing the checkout makes that a
      # property of the machine rather than a promise about the command.
      - name: Remove the platform checkout
        run: |
          rm -rf platform
          test ! -e platform && echo "ok: no platform checkout on this machine"

      - name: Install Rust from clwd's rust-toolchain.toml
        working-directory: clwd
        run: rustup show active-toolchain || rustup toolchain install

      # Cached on clwd's own lockfile, so a cold build (most of this job's
      # eight minutes) happens only when the pinned tag changes. Restored
      # after the platform checkout is gone: the cache holds clwd's target/
      # only, so nothing from platform can reach this build through it.
      - name: Cache clwd build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: clwd

      - name: Build clwd alone
        working-directory: clwd
        run: |
          if ! cargo build --locked; then
            echo "::error::clwd does not build on its own at ${{ steps.pin.outputs.tag }}. Either a private type leaked from platform into a public crate, or the pinned tag is not standalone-buildable. This is the failure the two-repo split exists to catch — do not fix it by adding a dependency here."
            exit 1
          fi
          echo "ok: clwd builds standalone at ${{ steps.pin.outputs.tag }}"

      # A build failing is the loud case. This is the quiet one: clwd could
      # depend on something in clwdrun/platform over git and still build, since
      # the token can read both. Nothing public may reach back across the seam.
      - name: Assert nothing depends on clwdrun/platform
        working-directory: clwd
        run: |
          if cargo tree --locked --prefix none --format "{p}" | grep -i "clwdrun/platform"; then
            echo "::error::a public crate depends on clwdrun/platform. The seam is one-way: platform consumes clwd, never the reverse."
            exit 1
          fi
          echo "ok: no dependency on clwdrun/platform"
