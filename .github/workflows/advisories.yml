name: advisories

# `ci` checks advisories only when something is pushed. An advisory published
# against a dependency we already lock arrives with no push, so on a quiet week
# the gate never looks. This runs the same check against `main` every day, so a
# new advisory fails a run within a day instead of on the next unrelated pull
# request.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  # DEMO ONLY: this branch is deleted after the demonstration.
  push:
    branches: [advisories-report-demo]

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 3
  # The seam dependency lives in a private repository; see ci.yml.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate for the clwd seam dependency
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.CLWD_READ_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install cargo-deny
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-deny

      - name: advisories
        # DEMO ONLY: a forced failure, to exercise the report job.
        run: exit 1

  # A failing daily check is worth nothing if nobody sees it: this one failed
  # quietly for eight days. On failure, comment on the open tracking issue, or
  # open one. Closing the issue once `main` is fixed lets the next failure open
  # a new one.
  report:
    needs: advisories
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "advisories: the daily dependency check is failing"
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The daily \`cargo deny check advisories\` run against \`main\` failed: $RUN_URL

          Fix the lockfile or record an accepted advisory in \`deny.toml\` with an owner, then close this issue. Each later failure comments here while it is open."
          fi
